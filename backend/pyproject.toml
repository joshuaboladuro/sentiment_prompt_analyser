[project]
name = "sentiment-prompt-analyser-backend"
version = "1.0.0"
description = "FastAPI backend for the sentiment prompt analyser."
requires-python = ">=3.10"
authors = [
    { name = "Joshua Boladuro", email = "joshb971@outlook.com" },
]
license = { text = "MIT" }

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["sentiment", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
